name: Build PLAYTV (Chromium + Legacy)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'app-chromium/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25 (required by bundled Chromium)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build both variants
        run: gradle --no-daemon :app:assembleDebug :app-chromium:assembleDebug

      - name: Rename APKs for clarity
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PLAYTV-Legacy-WebView-Android9Plus-debug.apk
          cp app-chromium/build/outputs/apk/debug/app-chromium-debug.apk dist/PLAYTV-Bundled-Chromium-Android10Plus-debug.apk
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PLAYTV-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
