name: Build PLAYTV

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    name: Validate catalog and launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_catalog.py shared/assets/games.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check shared/assets/launcher/app.js

  legacy:
    name: Legacy Fire TV APK (system WebView)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PLAYTV-Legacy-FireTV
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  chromium:
    name: Chromium (Cefrium) APK - experimental
    needs: checks
    runs-on: ubuntu-latest
    continue-on-error: true   # depends on a third-party Maven repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - run: gradle --no-daemon :app-chromium:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PLAYTV-Chromium
          path: app-chromium/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
