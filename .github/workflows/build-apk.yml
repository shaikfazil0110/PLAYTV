name: Build PLAYTV (Chromium + Legacy)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'app-chromium/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25 (required by bundled Chromium)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 platform
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify game catalog JSON
        run: |
          python3 - <<'PYJSON'
          import json
          for path in ('app/src/main/assets/games.json', 'app-chromium/src/main/assets/games.json'):
              games = json.load(open(path, encoding='utf-8'))
              assert games, f'{path} is empty'
              urls = [g['url'] for g in games]
              assert len(urls) == len(set(urls)), f'{path} contains duplicate game URLs'
              for game in games:
                  assert all(k in game for k in ('name', 'genre', 'url', 'platform')), game
              print(f'{path}: {len(games)} entries OK')
          PYJSON

      - name: Build both variants
        run: gradle --no-daemon :app:assembleDebug :app-chromium:assembleDebug

      - name: Rename APKs for clarity
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PLAYTV-Legacy-WebView-Android9Plus-debug.apk
          cp app-chromium/build/outputs/apk/debug/app-chromium-debug.apk dist/PLAYTV-Bundled-Chromium-Android10Plus-debug.apk
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PLAYTV-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
