name: Build PLAYTV Legacy Fire TV

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'app-chromium/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Legacy Fire TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platforms
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Verify game catalog JSON
        run: |
          python3 - <<'PYJSON'
          import json
          for path in ('app/src/main/assets/games.json', 'app-chromium/src/main/assets/games.json'):
              games = json.load(open(path, encoding='utf-8'))
              assert games, f'{path} is empty'
              urls = [g['url'] for g in games]
              assert len(urls) == len(set(urls)), f'{path} contains duplicate game URLs'
              print(f'{path}: {len(games)} entries verified OK')
          PYJSON

      - name: Build Legacy Fire TV APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/PLAYTV-Legacy-FireOS7-API28-debug.apk
          fi
          ls -lh dist

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PLAYTV-Legacy-FireTV-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
